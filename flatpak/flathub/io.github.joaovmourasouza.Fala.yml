id: io.github.joaovmourasouza.Fala
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: fala
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Microfone
  - --socket=pulseaudio
  # Download do modelo Whisper (Hugging Face) e transcrição opcional via Groq
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  # O ajuste do texto roda o `claude -p` (Claude Code) instalado no sistema do usuário,
  # com o login dele, via flatpak-spawn --host. Veja flatpak/flathub-justification.md.
  - --talk-name=org.freedesktop.Flatpak

cleanup-commands:
  # O script do WebEngine primeiro: o cleanup-BaseApp.sh apaga a si mesmo e aos outros.
  - /app/cleanup-BaseApp-QtWebEngine.sh
  - /app/cleanup-BaseApp.sh

modules:
  - name: portaudio
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --without-jack
      - --without-oss
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'
    sources:
      - type: archive
        url: https://files.portaudio.com/archives/pa_stable_v190700_20210406.tgz
        sha256: 47efbf42c77c19a05d22e627d42873e991ec0c1357219c0d74ce6a2948cb2def

  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      - -Dzshcompletiondir=no
      - -Dfishcompletiondir=no
    cleanup:
      - /share/man
      - /share/bash-completion
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v2.2.1.tar.gz
        sha256: 6eb8081207fb5581d1d82c4bcd9587205a31a3d47bea3ebeb7f41aa1143783eb

  - python3-deps.yaml

  - name: fala
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-deps --no-build-isolation --no-index .
      - install -Dm644 data/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 data/${FLATPAK_ID}.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 data/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: git
        url: https://github.com/joaovmourasouza/fala.git
        tag: v0.1.0
        commit: 4c8f092b465619d741479b8d4280aca15e0710d9
