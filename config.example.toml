# Copie para ~/.config/fala/config.toml e ajuste.

language = "pt"

# "local" (faster-whisper, roda na sua máquina, precisa do extra [local])
# ou "groq" (API, rápido; exige GROQ_API_KEY no ambiente)
transcriber = "local"

# local: tiny | base | small | medium | large-v3-turbo
# groq:  whisper-large-v3-turbo | whisper-large-v3
# vazio = padrão do backend escolhido
whisper_model = ""

# Pós-processamento com Claude (pontuação, remove "é...", "tipo", autocorreções).
# Exige ANTHROPIC_API_KEY (ou `ant auth login`). Se falhar, o texto bruto é usado.
cleanup = true
claude_model = "claude-opus-5-5"
claude_effort = "low"   # low | medium | high

# Atalho usado para colar: "ctrl+v" ou "ctrl+shift+v" (terminais)
paste_keys = "ctrl+v"

# Nome ou índice do microfone (veja `python -m sounddevice`); vazio = padrão do sistema
audio_device = ""

# Para a gravação automaticamente depois de N segundos
max_seconds = 300
