[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fala"
version = "0.1.0"
description = "Ditado por voz em qualquer app — clone brasileiro do Wispr Flow"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "PyQt6>=6.7",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.1"]

[project.scripts]
fala = "fala.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fala"]
