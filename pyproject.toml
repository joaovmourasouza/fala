[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fala"
version = "0.1.0"
description = "Ditado por voz em qualquer app — clone brasileiro do Wispr Flow"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "PyQt6>=6.7",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "httpx>=0.27",
    "jeepney>=0.8",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.1"]

[project.scripts]
fala = "fala.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fala = ["config.example.toml", "icons/*.svg", "icons/README.md"]
